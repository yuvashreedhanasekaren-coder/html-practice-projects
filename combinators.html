<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>combinators</title>
    <style>
        /* .parent p,h2{
            color: red;
        } */
        /* .parent>p,h2,h1{
            color: red;
        } */
        /* .parent+p,h1{
            color: red;
        } */
        .parent~p,h1{
            color: red;
        }
    </style>
</head>
<body>
    <div class="parent">
        <p>child1</p>
        <p>child2</p>
        <h1>child2.1</h1>
        <h2>child 3</h2>
        <div id="parent2">
            <p>child 1 of parent2</p>
        </div>
        
    </div>
    <p>sibling 1</p>
    <p>sibling 2</p>
</body>
</html>
