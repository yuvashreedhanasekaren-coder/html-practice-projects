<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <table cellpadding="5" cellspacing="0" border="10">
            <caption><i>Weather station</i></caption> 
            <thead bgcolor="green">
                <tr>
                    <th rowspan="2">Station</th>
                    <th colspan="2">Temperature</th>       
                    <th rowspan="2">Humidity</th>
                    <th rowspan="2">Weather</th>
                </tr>
                <tr>
                    <th>Max</th>
                    <th>Min</th>
               </tr>
            </thead>  
            <tbody>
                <tr align="center">
                    <th>USA</th>
                    <td>24</td>
                    <td>19</td>
                    <td>60%</td>
                    <td>cloudy</td>
                </tr>
                <tr align="center">
                    <th>Germany</th>
                    <td>5</td>
                    <td>-1</td>
                    <td>70%</td>
                    <td>Rainy</td>
                </tr>
            </tbody>      
        </table>
    </div>
</body>
</html>
