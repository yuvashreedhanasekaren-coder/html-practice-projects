<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <form>
        <fieldset>
            <center>
                <legend><b>Student Admission forms</b></legend>
            </center>
            <div>
                <label>Username</label>
                <input type="text" placeholder="Username">
            </div>
            <div>
                <label>Email Id</label>
                <input type="email" placeholder="Email Id">
            </div>
            <div>
                <label>Password</label>
                <input type="password" placeholder="password">
            </div>
            <div>
                <label for="">DOB :</label>
                <input type="date">
            </div>
            <div>
                <label for="">Time :</label>
            <input type="time">
            </div>
            <div>
                <label for="">Month :</label>
                <input type="month">
            </div>
            <div>
                <label for="">DateTime :</label>
                <input type="datetime-local">
            </div>
            <div>
                <label for="">week</label>
                <input type="week">
            </div>
            <div>
                <label for="">number</label>
                <input type="number">
            </div>
            <div>
                <input type="checkbox">
                <label for="">show password</label>
            </div>
            <div>
                <label for="">gender</label>
                <input type="radio" value="male" name="gender">male
                <input type="radio" value="female" name="gender">female
            </div>
            <div>
                <label for="">Address:</label>
                <textarea name="" id="" placeholder="enter your comments"></textarea>
                <!-- <input type="textarea" placeholder="enter your comments"> -->
            </div>

            <div>
                <label for="">city</label>
                <select>
                    <option value="">-select-</option>
                    <option value="hosur">hosur</option>
                    <option value="vellore">vellore</option>
                    <option value="tenkasi">tenkasi</option>
                </select>
            </div>
            <div>
                <label for="">state</label>

                <select name="" id="">
                    <option value="">select sates</option>
                    <optgroup label="Southern states">
                        
                        <!-- <option value="">-select-</option> -->
                        <option value="TN">TN</option>
                        <option value="KA">KA</option>
                        <option value="KL">KL</option>
                    </optgroup>

                    <optgroup label="Northern states">
                        <!-- <option value="">-select-</option> -->
                        <option value="GJ">GJ</option>
                        <option value="MP">MP</option>
                        <option value="RJ">RJ</option>
                    </optgroup>
                </select>
            </div>
            <div>
                <button>submit</button>
                <input type="button" value="login">
                <button type="button">Send message</button>
                <input type="reset">
                <!-- <input type="reset" value="login"> -->
                <input type="submit">
            </div>
        </fieldset>
    </form>
    
</body>
</html>
